<!doctype html>
<html lang="it">
<head>
	<meta charset="utf-8" />
	<title>Errore 500 - WAY Cortese</title>
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<style>
		:root {
			--bg: #f8fafc;
			--card-bg: #ffffff;
			--text: #0f172a;
			--muted: #64748b;
			--border: #e2e8f0;
			--primary: #2563eb;
			--primary-hover: #1d4ed8;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #0f131c;
				--card-bg: #1c2230;
				--text: #f1f5f9;
				--muted: #94a3b8;
				--border: #2d3748;
				--primary: #3b82f6;
				--primary-hover: #60a5fa;
			}
		}
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: var(--bg);
			color: var(--text);
			padding: 1.5rem;
			box-sizing: border-box;
		}
		.card {
			background: var(--card-bg);
			border: 1px solid var(--border);
			border-radius: 16px;
			padding: 2.5rem 1.75rem;
			max-width: 440px;
			width: 100%;
			text-align: center;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 1.25rem;
			box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
		}
		.card img {
			width: 240px;
			max-width: 100%;
			height: auto;
			aspect-ratio: 1 / 1;
			border-radius: 12px;
			object-fit: contain;
		}
		h2 {
			font-size: 1.35rem;
			font-weight: 700;
			margin: 0;
			color: var(--text);
			line-height: 1.3;
		}
		.subtitle {
			font-size: 0.925rem;
			color: var(--muted);
			margin: 0;
			line-height: 1.45;
		}
		.btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 0.5rem;
			padding: 0.65rem 1.25rem;
			border-radius: 10px;
			background: var(--primary);
			color: #ffffff;
			text-decoration: none;
			font-size: 0.875rem;
			font-weight: 600;
			border: none;
			cursor: pointer;
			transition: background 0.15s ease;
		}
		.btn:hover {
			background: var(--primary-hover);
		}
		@media (max-width: 640px) {
			.card img {
				width: 160px;
			}
		}
	</style>
</head>
<body>
	<div class="card">
		<img src="%sveltekit.assets%/eastereggs/500.webp" alt="Panda al lavoro" onerror="if(!this.dataset.retry){this.dataset.retry=1;this.src='%sveltekit.assets%/eastereggs/500.webp';}" />
		<div>
			<h2>Si è verificato un problema</h2>
			<p class="subtitle">Un panda altamente addestrato sta cercando di risolverlo.</p>
		</div>
		<button type="button" class="btn" onclick="location.reload()">Ricarica la pagina</button>
	</div>
</body>
</html>
